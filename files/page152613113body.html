(function(){
  function loadFont(url) {
    var s = document.createElement('style');
    s.textContent = "@import url('" + url + "');";
    document.head.appendChild(s);
  }
  loadFont('https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;1,500&family=Jost:wght@300;400;600&display=swap');

  /* ЗМІНИТИ: список пар фото "до/після" + підпис */
  var pairs = [
    {
      before: 'images/tild6264-3138-4835-a538-653534633363__chatgpt_image_30__20.png',
      after:  'images/tild3965-6438-4334-b135-333664626330__chatgpt_image_1__202.png',
      caption: 'Реставрація шкіряної сумки — заміна підкладки, відновлення кольору та заміна каркасу сумки після втрати форми'
    }
    /* ДОДАТИ БІЛЬШЕ ПАР: скопіюй рядки вище і встав свої фото */
  ];

  var slider = document.getElementById('baSlider');
  var afterWrap = document.getElementById('baAfterWrap');
  var beforeImg = document.getElementById('baBeforeImg');
  var afterImg = document.getElementById('baAfterImg');
  var dividerLine = document.getElementById('baDividerLine');
  var handle = document.getElementById('baHandle');
  var caption = document.getElementById('baCaption');
  var counter = document.getElementById('baCounter');
  var currentPair = 0;
  var pos = 50;

  function updateCounter() {
    counter.textContent = (currentPair + 1) + ' / ' + pairs.length;
  }

  function setPos(percent) {
    pos = Math.max(5, Math.min(95, percent));
    afterWrap.style.width = pos + '%';
    dividerLine.style.left = pos + '%';
    handle.style.left = pos + '%';
  }

  function loadPair(idx) {
    currentPair = (idx + pairs.length) % pairs.length;
    var p = pairs[currentPair];
    beforeImg.src = p.before;
    afterImg.src = p.after;
    caption.textContent = p.caption;
    updateCounter();
    setPos(50);
  }

  document.getElementById('baPrev').addEventListener('click', function() {
    loadPair(currentPair - 1);
  });
  document.getElementById('baNext').addEventListener('click', function() {
    loadPair(currentPair + 1);
  });

  updateCounter();

  var dragging = false;

  function getPercentFromEvent(e) {
    var rect = slider.getBoundingClientRect();
    var clientX = e.touches ? e.touches[0].clientX : e.clientX;
    return ((clientX - rect.left) / rect.width) * 100;
  }

  function startDrag(e) { dragging = true; e.preventDefault(); }
  function stopDrag() { dragging = false; }
  function onDrag(e) { if (!dragging) return; setPos(getPercentFromEvent(e)); }

  slider.addEventListener('mousedown', startDrag);
  slider.addEventListener('touchstart', startDrag, { passive: false });
  window.addEventListener('mouseup', stopDrag);
  window.addEventListener('touchend', stopDrag);
  window.addEventListener('mousemove', onDrag);
  window.addEventListener('touchmove', onDrag, { passive: false });

  slider.addEventListener('click', function(e) {
    if (e.target.closest('.ba-handle')) return;
    setPos(getPercentFromEvent(e));
  });

  setPos(50);
})();
