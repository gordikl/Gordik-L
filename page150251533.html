(function(){
  function loadFont(url) {
    var s = document.createElement('style');
    s.textContent = "@import url('" + url + "');";
    document.head.appendChild(s);
  }
  loadFont('https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;1,500&family=Jost:wght@300;400;600&display=swap');

  /* ЗМІНИТИ: список пар фото "до/після" + підпис */
  var pairs = [
    {
      before: 'https://images.unsplash.com/photo-1605733513597-a8f8341084e6?w=900&q=80',
      after:  'https://images.unsplash.com/photo-1548036328-c9fa89d128fa?w=900&q=80',
      caption: 'Реставрація шкіряної сумки — заміна фурнітури та відновлення кольору'
    },
    {
      before: 'https://images.unsplash.com/photo-1473188588951-666fce8e7c68?w=900&q=80',
      after:  'https://images.unsplash.com/photo-1590874103328-eac38a683ce7?w=900&q=80',
      caption: 'Відновлення ручок та торцювання краю'
    },
    {
      before: 'https://images.unsplash.com/photo-1627123424574-724758594e93?w=900&q=80',
      after:  'https://images.unsplash.com/photo-1607082348824-0a96f2a4b9da?w=900&q=80',
      caption: 'Реставрація гаманця — заміна підкладки та фурнітури'
    }
  ];

  var slider = document.getElementById('baSlider');
  var afterWrap = document.getElementById('baAfterWrap');
  var beforeImg = document.getElementById('baBeforeImg');
  var afterImg = document.getElementById('baAfterImg');
  var dividerLine = document.getElementById('baDividerLine');
  var handle = document.getElementById('baHandle');
  var caption = document.getElementById('baCaption');
  var dots = document.querySelectorAll('.ba-nav-dot');
  var currentPair = 0;
  var pos = 50;

  function setPos(percent) {
    pos = Math.max(5, Math.min(95, percent));
    afterWrap.style.width = pos + '%';
    dividerLine.style.left = pos + '%';
    handle.style.left = pos + '%';
  }

  function loadPair(idx) {
    currentPair = idx;
    var p = pairs[idx];
    beforeImg.src = p.before;
    afterImg.src = p.after;
    caption.textContent = p.caption;
    dots.forEach(function(d, i) {
      d.classList.toggle('active', i === idx);
    });
    setPos(50);
  }

  dots.forEach(function(dot) {
    dot.addEventListener('click', function() {
      loadPair(parseInt(dot.getAttribute('data-index')));
    });
  });

  var dragging = false;

  function getPercentFromEvent(e) {
    var rect = slider.getBoundingClientRect();
    var clientX = e.touches ? e.touches[0].clientX : e.clientX;
    var percent = ((clientX - rect.left) / rect.width) * 100;
    return percent;
  }

  function startDrag(e) {
    dragging = true;
    e.preventDefault();
  }
  function stopDrag() {
    dragging = false;
  }
  function onDrag(e) {
    if (!dragging) return;
    setPos(getPercentFromEvent(e));
  }

  slider.addEventListener('mousedown', startDrag);
  slider.addEventListener('touchstart', startDrag, { passive: false });
  window.addEventListener('mouseup', stopDrag);
  window.addEventListener('touchend', stopDrag);
  window.addEventListener('mousemove', onDrag);
  window.addEventListener('touchmove', onDrag, { passive: false });

  slider.addEventListener('click', function(e) {
    if (e.target.closest('.ba-handle')) return;
    setPos(getPercentFromEvent(e));
  });

  setPos(50);
})();
</script> <!-- nominify end --> </div> </div> </div> </div> </div> <!--/allrecords--> <!-- Tilda copyright. Don't remove this line --><div class="t-tildalabel " id="tildacopy" data-tilda-sign="23709763#150251533"><a href="https://tilda.cc/" class="t-tildalabel__link"><div class="t-tildalabel__wrapper"><div class="t-tildalabel__txtleft">Made on </div><div class="t-tildalabel__wrapimg"><img src="images/tildacopy.png" class="t-tildalabel__img" fetchpriority="low" alt=""></div><div class="t-tildalabel__txtright">Tilda</div></div></a></div> <!-- Stat --> <script type="text/javascript">if(!window.mainTracker) {window.mainTracker='tilda';}
